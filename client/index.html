<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Premium Portfolio - Showcase Your Best Work</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="A beautiful, premium portfolio website to showcase your projects, services, and client testimonials. Built with modern web technologies." />
    <meta name="keywords" content="portfolio, projects, web development, design, showcase" />
    <meta name="author" content="Your Name" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph Tags for Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Premium Portfolio - Showcase Your Best Work" />
    <meta property="og:description" content="A beautiful, premium portfolio website to showcase your projects, services, and client testimonials." />
    <meta property="og:url" content="https://yourportfolio.com" />
    
    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Premium Portfolio - Showcase Your Best Work" />
    <meta name="twitter:description" content="A beautiful, premium portfolio website to showcase your projects, services, and client testimonials." />
    
    <!-- Additional SEO -->
    <meta name="theme-color" content="#3b82f6" />
    <link rel="canonical" href="https://yourportfolio.com" />
    
    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
